<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/room.css}">
</head>
<body>
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="page-title"><span class="material-symbols-outlined" style="vertical-align: bottom;">home</span> Room Management</h2>
            <p class="text-muted">Manage all Smart Kost rooms</p>
        </div>
        <button class="btn btn-primary custom-btn" data-bs-toggle="modal" data-bs-target="#roomModal">Add Room</button>
    </div>

    <div class="modal fade" id="editRoomModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Edit Room</h5>
                </div>
                <div class="modal-body">
                    <form id="editRoomForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Room Number</label>
                            <input id="editRoomNumber" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Room Type</label>
                            <input id="editRoomType" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input id="editPrice" type="number" class="form-control" required min="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Capacity</label>
                            <input id="editCapacity" type="number" class="form-control" required min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="editDescription" class="form-control" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary custom-btn" onclick="updateRoom()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Statistics -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="stat-card">
                <h6>Total Rooms</h6>
                <h2 id="totalRooms">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h6>Available Rooms</h6>
                <h2 id="availableRooms">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h6>Occupied Rooms</h6>
                <h2 id="occupiedRooms">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h6>Maintenance</h6>
                <h2 id="maintenanceRooms">0</h2>
            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <input type="text" id="searchRoom" class="form-control" placeholder="Search room number...">
        </div>
    </div>
    
    <select id="statusFilter" class="form-select mb-3">
        <option value="">All Statuses</option>
        <option value="AVAILABLE">Available</option>
        <option value="OCCUPIED">Occupied</option>
        <option value="MAINTENANCE">Maintenance</option>
    </select>

    <!-- Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>No</th>
                    <th>Number</th>
                    <th>Type</th>
                    <th>Price</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="roomTable">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="roomModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Add Room</h5>
            </div>
            <div class="modal-body">
                <form id="roomForm">
                    <div class="mb-3">
                        <label class="form-label">Room Number</label>
                        <input id="roomNumber" class="form-control" placeholder="Room Number" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Room Type</label>
                        <input id="roomType" class="form-control" placeholder="Room Type" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input id="price" type="number" class="form-control" placeholder="Price" required min="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Capacity</label>
                        <input id="capacity" type="number" class="form-control" placeholder="Capacity" required min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="description" class="form-control" placeholder="Description" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary custom-btn" onclick="createRoom()">Save</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/rooms.js}"></script>
</body>
</html>
